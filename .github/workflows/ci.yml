name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check (wasm-gc)
        run: moon check

      - name: Type check (js)
        run: moon check --target js

      - name: Run tests (wasm-gc)
        run: moon test --enable-coverage

      - name: Run tests (js target)
        run: moon test --target js

      - name: Generate coverage report
        run: moon coverage report -f summary

      - name: Upload coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: moon coverage report -f coveralls --send-to coveralls --coveralls-token "$COVERALLS_REPO_TOKEN"

  js-smoke-test:
    runs-on: ubuntu-latest
    name: JS/WASM Smoke Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Build WASM/JS target
        run: moon build --target js ffi

      - name: Setup JS package
        working-directory: js
        run: |
          npm ci
          npm run build:ts
          npm run copy:moon

      - name: TypeScript type check
        working-directory: js
        run: npm run typecheck

      - name: Run WASM smoke test
        run: node js/test/smoke.test.mjs

      - name: Run FFI contract test
        run: node js/test/contract.test.mjs

      - name: Run exports verification test
        run: node js/test/exports.test.mjs

      - name: Validate npm package
        working-directory: js
        run: npm pack --dry-run
