name: npm Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: MoonBit format check
        run: moon fmt --check

      - name: MoonBit type check
        run: |
          moon check
          moon check --target js

      - name: MoonBit tests
        run: |
          moon test
          moon test --target js

      - name: Build JS/WASM package
        run: moon build --target js ffi

      - name: Setup JS package
        working-directory: js
        run: |
          npm ci
          npm run build:ts
          npm run copy:moon

      - name: TypeScript type check
        working-directory: js
        run: npm run typecheck

      - name: JS smoke test
        run: node js/test/smoke.test.mjs

      - name: JS contract test
        run: node js/test/contract.test.mjs

      - name: JS exports verification test
        run: node js/test/exports.test.mjs

      - name: Validate npm package contents
        working-directory: js
        run: npm pack --dry-run

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Build
        working-directory: js
        run: npm run build

      - name: Verify version matches tag
        working-directory: js
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: js
        run: npm publish --provenance --access public
